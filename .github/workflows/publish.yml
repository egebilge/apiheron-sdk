# Publishes to npm with trusted publishing (OIDC): no npm token exists. npm
# lists this repository and this file as the package's trusted publisher, and
# attaches a provenance statement because the repository is public.
name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      # Trusted publishing needs npm 11.5.1 or newer and Node 22.14 or newer.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: npm install -g npm@latest
      - run: npm publish
